# AWS cost per service and linked account, from Cost Explorer (model: aws_by_account)
version: 1
type: metrics_view

display_name: AWS Cost
model: aws_by_account
timeseries: date
smallest_time_grain: "day"

dimensions:
  - name: provider
    display_name: Provider
    column: provider
    description: "AWS, or \"<product> (via AWS)\" for Marketplace products billed through AWS"
  - name: service
    display_name: Service
    column: service
  - name: account_name
    display_name: Account
    column: account_name
  - name: account_id
    display_name: Account ID
    column: account_id

measures:
  - name: total_net_cost
    display_name: "Net cost"
    description: "After credits and discounts, AWS and Marketplace products"
    expression: "SUM(net_cost)"
    format_preset: currency_usd
    valid_percent_of_total: true
  - name: aws_net_cost
    display_name: "AWS cost"
    description: "Net cost of AWS's own services (Marketplace products left out)"
    expression: "SUM(CASE WHEN provider = 'AWS' THEN net_cost ELSE 0 END)"
    format_preset: currency_usd
  - name: marketplace_cost
    display_name: "Marketplace (e.g. Vercel)"
    description: "Marketplace products billed through AWS"
    expression: "SUM(CASE WHEN provider <> 'AWS' THEN net_cost ELSE 0 END)"
    format_preset: currency_usd
  - name: estimated_share
    display_name: "Share still estimated"
    description: "Part of the net cost on days AWS has not finalised yet"
    expression: "SUM(CASE WHEN estimated THEN net_cost ELSE 0 END) / NULLIF(SUM(net_cost), 0)"
    format_preset: percentage
