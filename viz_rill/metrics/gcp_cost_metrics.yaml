# GCP Cost Metrics View (auto-generated)
version: 1
type: metrics_view

display_name: GCP Cost Analytics
model: gcp_costs
timeseries: date
smallest_time_grain: "day"

dimensions:
  - name: environment
    display_name: Environment
    description: "Production / Staging / Development / Test / Other, from whole words in the project ID (e.g. pi-apps-production)"
    expression: |
      CASE
        WHEN REGEXP_MATCHES(LOWER(COALESCE(project__id, '')), '(^|[^a-z0-9])(prod|production|prd)([^a-z0-9]|$)') THEN 'Production'
        WHEN REGEXP_MATCHES(LOWER(COALESCE(project__id, '')), '(^|[^a-z0-9])(staging|stage|stg)([^a-z0-9]|$)') THEN 'Staging'
        WHEN REGEXP_MATCHES(LOWER(COALESCE(project__id, '')), '(^|[^a-z0-9])(dev|development)([^a-z0-9]|$)') THEN 'Development'
        WHEN REGEXP_MATCHES(LOWER(COALESCE(project__id, '')), '(^|[^a-z0-9])(test|testing|qa|e2e)([^a-z0-9]|$)') THEN 'Test'
        ELSE 'Other' END
  - name: billing_account_id
    column: billing_account_id
  - name: cost_type
    column: cost_type
  - name: currency
    column: currency
  - name: location__country
    column: location__country
  - name: location__location
    column: location__location
  - name: project__id
    column: project__id
  - name: project__name
    column: project__name
  - name: project__number
    column: project__number
  - name: resource__global_name
    column: resource__global_name
  - name: resource__name
    column: resource__name
  - name: service__description
    column: service__description
  - name: service__id
    column: service__id
  - name: sku__description
    column: sku__description
  - name: sku__id
    column: sku__id
  - name: transaction_type
    column: transaction_type
  - name: usage__unit
    column: usage__unit

measures:
  - name: total_cost
    display_name: "Cost before credits"
    expression: "SUM(cost)"
    format_preset: currency_usd

  - name: total_credits
    display_name: "Credits"
    expression: "SUM(credits_total)"
    format_preset: currency_usd

  - name: total_net_cost
    display_name: "Net Cost (after credits)"
    expression: "SUM(net_cost)"
    format_preset: currency_usd
    valid_percent_of_total: true

  - name: total_usage
    display_name: "Total Usage"
    expression: "SUM(usage__amount)"
    format_preset: humanize

  - name: cost_per_unit
    display_name: "Cost per Unit"
    expression: "SUM(cost) / NULLIF(SUM(usage__amount), 0)"
    format_preset: currency_usd

  - name: record_count
    display_name: "Record Count"
    expression: "COUNT(*)"
    format_preset: humanize