# 12-month GCP cost estimates for the GCP Spend Forecast page (model: gcp_forecast_estimates)
version: 1
type: metrics_view

display_name: GCP Spend Forecast - Estimates
model: gcp_forecast_estimates

dimensions:
  - name: rank
    display_name: Rank
    column: rank_text
  - name: sku
    display_name: SKU
    column: sku
  - name: ranked_sku
    display_name: "Rank and SKU"
    expression: "'#' || lpad(rank_text, 2, '0') || ' ' || sku"
  - name: line_type
    display_name: Line type
    column: line_type
  - name: weeks_used
    display_name: Weeks used
    column: weeks_used

measures:
  - name: past_12m_estimate
    display_name: "Estimated cost, past 12 months"
    expression: "SUM(past_12m_estimate)"
    description: "Average weekly net cost x 52"
    format_preset: currency_usd
  - name: next_12m_projection
    display_name: "Projected cost, next 12 months"
    expression: "SUM(next_12m_projection)"
    description: "Past-12-month estimate x 1.1"
    format_preset: currency_usd
  - name: nk_suggested
    display_name: "NK suggested"
    expression: "SUM(next_12m_projection) * 0.4"
    description: "40% of the projected cost for the next 12 months"
    format_preset: currency_usd
  - name: nk_suggested_table
    display_name: "𝐍𝐊 𝐬𝐮𝐠𝐠𝐞𝐬𝐭𝐞𝐝"
    expression: "SUM(next_12m_projection) * 0.4"
    description: "NK suggested, as shown in the tables (bold title): 40% of the projected cost for the next 12 months"
    format_preset: currency_usd
  - name: avg_weekly_cost
    display_name: "Average week"
    expression: "SUM(avg_weekly_cost)"
    format_preset: currency_usd
  - name: weekly_trend
    display_name: "Trend per week"
    expression: "SUM(weekly_trend)"
    description: "Slope of the straight-line trend: how much the weekly cost changes per week"
    format_preset: currency_usd
  - name: week_count
    display_name: "Weeks"
    expression: "MAX(week_count)"
    format_preset: humanize
