# Spike signals per provider, service and project / cluster for the Cost Spikes page (model: cost_spike_movers)
# No timeseries: every number is already as of the last complete day, so the page's time range does not apply.
# The day and 7-day measures leave out once-a-month charges (charge_pattern); month to date keeps them.
version: 1
type: metrics_view

display_name: Cost Spikes - Signals
model: cost_spike_movers

dimensions:
  - name: provider
    display_name: Provider
    column: provider
  - name: service
    display_name: Service / category
    column: service
  - name: component
    display_name: Project / cluster
    column: component
  - name: charge_pattern
    display_name: Charge pattern
    column: charge_pattern
    description: "Monthly charge: billed on the same day each month (e.g. GCP Support); left out of the day and 7-day numbers"
  - name: as_of_date
    display_name: Data as of
    expression: "STRFTIME(as_of_date, '%Y-%m-%d')"
    description: "Last complete day every provider has; all numbers end on this day"
  - name: latest_loaded_day
    display_name: Latest day loaded
    expression: "STRFTIME(latest_loaded_day, '%Y-%m-%d')"
    description: "Latest (still partial) day loaded for the provider; far behind today means its load stopped"
  # The days each number covers, for the page text
  - name: latest_day_period
    display_name: Latest day (period)
    column: latest_day_period
  - name: avg_7d_period
    display_name: 7-day average (period)
    column: avg_7d_period
  - name: last_7d_period
    display_name: Last 7 days (period)
    column: last_7d_period
  - name: prev_7d_period
    display_name: Previous 7 days (period)
    column: prev_7d_period
  - name: mtd_period
    display_name: Month to date (period)
    column: mtd_period
  - name: prev_mtd_period
    display_name: Last month, same days (period)
    column: prev_mtd_period

measures:
  - name: latest_day_cost
    display_name: "Latest day"
    expression: "SUM(CASE WHEN charge_pattern = 'Daily usage' THEN latest_day_cost ELSE 0 END)"
    description: "Cost on the last complete day (Data as of), without once-a-month charges"
    format_preset: currency_usd
  - name: prev_7d_avg
    display_name: "7-day average"
    expression: "SUM(CASE WHEN charge_pattern = 'Daily usage' THEN prev_7d_avg ELSE 0 END)"
    description: "Average day of the 7 days before the latest day (the latest day itself not included)"
    format_preset: currency_usd
  - name: latest_vs_avg
    display_name: "Latest day vs 7-day avg"
    expression: "SUM(CASE WHEN charge_pattern = 'Daily usage' THEN latest_day_cost - prev_7d_avg ELSE 0 END)"
    description: "Latest day minus the average day of the 7 days before it"
    format_preset: currency_usd
  - name: latest_vs_avg_pct
    display_name: "Latest day vs 7-day avg %"
    expression: >
      SUM(CASE WHEN charge_pattern = 'Daily usage' THEN latest_day_cost - prev_7d_avg ELSE 0 END)
      / NULLIF(SUM(CASE WHEN charge_pattern = 'Daily usage' THEN prev_7d_avg ELSE 0 END), 0)
    description: "How much the latest day is above (+) or below (-) the average day of the 7 days before it"
    format_preset: percentage
  - name: last_7d_cost
    display_name: "Last 7 days"
    expression: "SUM(CASE WHEN charge_pattern = 'Daily usage' THEN last_7d_cost ELSE 0 END)"
    description: "Total of the last 7 days, the latest day included"
    format_preset: currency_usd
  - name: prev_7d_cost
    display_name: "Previous 7 days"
    expression: "SUM(CASE WHEN charge_pattern = 'Daily usage' THEN prev_7d_cost ELSE 0 END)"
    description: "Total of the 7 days before the last 7 days"
    format_preset: currency_usd
  - name: wow_change
    display_name: "Last 7 days vs previous 7"
    expression: "SUM(CASE WHEN charge_pattern = 'Daily usage' THEN last_7d_cost - prev_7d_cost ELSE 0 END)"
    description: "Total of the last 7 days minus the total of the 7 days before"
    format_preset: currency_usd
  - name: wow_change_pct
    display_name: "Last 7 days vs previous 7 %"
    expression: >
      SUM(CASE WHEN charge_pattern = 'Daily usage' THEN last_7d_cost - prev_7d_cost ELSE 0 END)
      / NULLIF(SUM(CASE WHEN charge_pattern = 'Daily usage' THEN prev_7d_cost ELSE 0 END), 0)
    description: "Total of the last 7 days vs the total of the 7 days before (both 7 days, so the same as per day)"
    format_preset: percentage
  - name: mtd_cost
    display_name: "Month to date"
    expression: "SUM(mtd_cost)"
    description: "Total from the 1st of the month to the latest day, once-a-month charges included"
    format_preset: currency_usd
  - name: prev_mtd_cost
    display_name: "Last month, same days"
    expression: "SUM(prev_mtd_cost)"
    description: "Total of last month from the 1st to the same day of the month (its last day if last month is shorter)"
    format_preset: currency_usd
  # Compared per day: at the end of a month last month can have fewer days (Mar 1-31 vs Feb 1-28), and
  # comparing totals would show that as growth.
  - name: mtd_change_pct
    display_name: "Month to date vs last month %"
    expression: "(SUM(mtd_cost) / MAX(mtd_days)) / NULLIF(SUM(prev_mtd_cost) / MAX(prev_mtd_days), 0) - 1"
    description: "Average cost per day this month so far vs last month over the same days; per day because last month can be shorter"
    format_preset: percentage
