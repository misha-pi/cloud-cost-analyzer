# GCP Cost Overview: the main GCP page (metrics view: gcp_cost_metrics).
# Merges the former "GCP Product Deep Dive" page. Everything is net cost after credits, like the
# "GCP Cost by Service and App" and "GCP and MongoDB Atlas Cost" pages. Time charts follow the time grain
# picked in the time filter; any other breakdown is in the GCP Cost Explorer.

type: canvas
display_name: "GCP Cost Overview"

defaults:
  time_range: P30D
  comparison_mode: time

rows:
  - items:
      - markdown:
          content: |
            GCP cost from the billing export, as **net cost after credits** (the same number as the other GCP pages).
            "Cost before credits" and "Credits" show how much credits saved.
        width: 12
    height: 80px

  - items:
      - kpi_grid:
          metrics_view: gcp_cost_metrics
          measures: [total_net_cost, total_cost, total_credits, record_count]
          comparison: [delta, percent_change]
        width: 12
    height: 160px

  # Trend
  - items:
      - stacked_bar:
          metrics_view: gcp_cost_metrics
          title: "Net cost over time by service"
          x:
            field: date
            type: temporal
          y:
            field: total_net_cost
            type: quantitative
            zeroBasedOrigin: true
          color:
            field: service__description
            type: nominal
            limit: 10
        width: 12
    height: 360px

  # Services and projects
  - items:
      - leaderboard:
          metrics_view: gcp_cost_metrics
          title: "Top services"
          dimensions: [service__description]
          measures: [total_net_cost]
          num_rows: 15
        width: 6
      - leaderboard:
          metrics_view: gcp_cost_metrics
          title: "Top projects"
          dimensions: [project__name]
          measures: [total_net_cost]
          num_rows: 15
        width: 6
    height: 400px

  # SKUs
  - items:
      - leaderboard:
          metrics_view: gcp_cost_metrics
          title: "Top SKUs"
          dimensions: [sku__description]
          measures: [total_net_cost, total_usage]
          num_rows: 20
        width: 12
    height: 400px

  # Environment, region, cost type
  - items:
      - leaderboard:
          metrics_view: gcp_cost_metrics
          title: "By environment"
          dimensions: [environment]
          measures: [total_net_cost]
          num_rows: 10
        width: 4
      - leaderboard:
          metrics_view: gcp_cost_metrics
          title: "By region"
          dimensions: [location__location]
          measures: [total_net_cost]
          num_rows: 15
        width: 4
      - leaderboard:
          metrics_view: gcp_cost_metrics
          title: "By cost type"
          dimensions: [cost_type]
          measures: [total_net_cost]
          num_rows: 10
        width: 4
    height: 360px

time_ranges: [P7D, P30D, P3M, P6M, P12M, rill-MTD, rill-PM, rill-YTD]
filters:
  enable: true

theme: theme
