# AWS cost from Cost Explorer (models: aws_by_account, aws_service_daily, aws_by_region, aws_by_usage_type).
# Cost by tag (aws_by_tag, aws_tag_cost_metrics) is loaded but not shown until cost allocation tags are active.
# Time charts follow the time grain picked in the time filter (day, week, month, year).
type: canvas
display_name: "AWS Cost"

defaults:
  time_range: P30D
  comparison_mode: time

rows:
  - items:
      - markdown:
          content: |
            AWS cost from Cost Explorer for all linked accounts, net of credits and discounts. **Vercel**, bought
            through AWS Marketplace and billed on the AWS bill, is counted apart from **AWS cost**. The last few days
            are **estimated** until AWS finalises them.
        width: 12
    height: 80px
  - items:
      - kpi_grid:
          metrics_view: aws_cost_metrics
          measures: [aws_net_cost, vercel_cost, estimated_share]
          comparison: [delta, percent_change]
        width: 12
    height: 160px
  - items:
      - stacked_bar:
          metrics_view: aws_service_daily_metrics
          title: "AWS cost over time by service (top 10 and Other; Vercel left out)"
          x:
            field: date
            type: temporal
          y:
            field: total_net_cost
            type: quantitative
            zeroBasedOrigin: true
          color:
            legendOrientation: right
            field: service
            type: nominal
            limit: 10
        width: 12
    height: 360px
  - items:
      - pivot:
          metrics_view: aws_cost_metrics
          title: "Cost by account and service (expand an account)"
          row_dimensions: [account_name, service]
          measures: [total_net_cost]
        width: 7
      - stacked_bar:
          metrics_view: aws_region_cost_metrics
          title: "Cost by region"
          x:
            field: total_net_cost
            type: quantitative
            zeroBasedOrigin: true
          y:
            field: region
            type: nominal
            sort: "-x"
            limit: 15
          color:
            legendOrientation: right
            field: provider
            type: nominal
        width: 5
    height: 420px
  - items:
      - leaderboard:
          metrics_view: aws_usage_type_cost_metrics
          title: "Top 20 usage types (what was billed)"
          dimensions: [usage_label]
          measures: [total_net_cost, total_usage]
          num_rows: 20
        width: 12
    height: 460px
  - items:
      - pivot:
          metrics_view: aws_cost_metrics
          title: "Monthly cost by service"
          row_dimensions: [service]
          col_dimensions: [date_rill_TIME_GRAIN_MONTH]
          measures: [total_net_cost]
        width: 12
    height: 420px

time_ranges: [P7D, P30D, P3M, P6M, P12M, rill-PM, rill-MTD]
filters:
  enable: true

theme: theme
