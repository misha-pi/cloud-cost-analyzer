# AWS cost from Cost Explorer (models: aws_by_account, aws_by_region, aws_by_usage_type, aws_by_tag).
# Time charts follow the time grain picked in the time filter (day, week, month, year).
type: canvas
display_name: "AWS Cost"

defaults:
  time_range: P3M
  comparison_mode: time

rows:
  - items:
      - markdown:
          content: |
            AWS cost from Cost Explorer for all linked accounts, net of credits and discounts. Products bought
            through AWS Marketplace (e.g. **Vercel**) are counted apart from **AWS cost**. The last few days are
            **estimated** until AWS finalises them.
        width: 12
    height: 80px
  - items:
      - kpi_grid:
          metrics_view: aws_cost_metrics
          measures: [aws_net_cost, marketplace_cost, estimated_share]
          comparison: [delta, percent_change]
        width: 12
    height: 160px
  - items:
      - stacked_bar:
          metrics_view: aws_cost_metrics
          title: "AWS cost over time by service (Marketplace products left out)"
          x:
            field: date
            type: temporal
          y:
            field: aws_net_cost
            type: quantitative
            zeroBasedOrigin: true
          color:
            field: service
            type: nominal
            limit: 10
        width: 12
    height: 360px
  - items:
      - pivot:
          metrics_view: aws_cost_metrics
          title: "Cost by account and service (expand an account)"
          row_dimensions: [account_name, service]
          measures: [total_net_cost]
        width: 7
      - stacked_bar:
          metrics_view: aws_region_cost_metrics
          title: "Cost by region"
          x:
            field: total_net_cost
            type: quantitative
            zeroBasedOrigin: true
          y:
            field: region
            type: nominal
            sort: "-x"
            limit: 15
          color:
            field: provider
            type: nominal
        width: 5
    height: 420px
  - items:
      - table:
          metrics_view: aws_usage_type_cost_metrics
          title: "Cost by usage type (what was billed)"
          columns: [service, usage_type, total_usage, usage_unit, total_net_cost]
        width: 7
      - pivot:
          metrics_view: aws_tag_cost_metrics
          title: "Cost by tag (only tags active as cost allocation tags; empty until one is)"
          row_dimensions: [tag_key, tag_value]
          measures: [total_net_cost]
        width: 5
    height: 460px
  - items:
      - pivot:
          metrics_view: aws_cost_metrics
          title: "Monthly cost by service"
          row_dimensions: [service]
          col_dimensions: [date_rill_TIME_GRAIN_MONTH]
          measures: [total_net_cost]
        width: 12
    height: 420px

time_ranges: [P3M, P6M, P12M, rill-PM, rill-MTD]
filters:
  enable: true

theme: theme
