# Cost summary for the leaders: one month at a time, GCP and MongoDB Atlas together. Has the
# "Each service's cost by app" table of gcp_overview_service_app plus the MongoDB rows, the "Cost over time
# by provider" chart of gcp_atlas_canvas and the "Kubernetes cost by workload" table of
# gcp_overview_service_app.
type: canvas
display_name: "Cost Summary"

defaults:
  time_range: rill-PM

rows:
  - items:
      - markdown:
          content: |
            Monthly cost by app: GCP net cost (after credits) per service, the same as the **GCP Cost by Service and App**
            page, plus MongoDB Atlas. Pick a month in the time filter.
            - **MongoDB**: each Atlas project's billed cost, given to the app whose name is in the project name
              (e.g. "Main App - MS - Production" goes to main app); projects matching no app go to **other**.
            - **MongoDB Pro**: Atlas charges for the whole organisation rather than one project (e.g. a support plan),
              shared across the apps in proportion to their MongoDB cost. We have none so far, so this row is not shown.
        width: 12
    height: 150px
  - items:
      - pivot:
          metrics_view: summary_app_cost_metrics
          title: "Each service's cost by app (services as rows, apps as columns)"
          row_dimensions: [service_name]
          col_dimensions: [app]
          measures: [total_net_cost]
        width: 12
    height: 480px
  - items:
      - stacked_bar:
          metrics_view: cloud_provider_cost_metrics
          title: "Cost over time by provider"
          x:
            field: date
            type: temporal
          y:
            field: total_cost
            type: quantitative
            zeroBasedOrigin: true
          color:
            field: provider
            type: nominal
        width: 12
    height: 360px
  # One GKE cluster per project, so a project's total is its cluster's cost.
  - items:
      - pivot:
          metrics_view: gcp_workload_cost_metrics
          title: "Kubernetes cost by workload (expand a project; no label = before cost allocation or cluster fees)"
          row_dimensions: [project__id, k8s_workload]
          measures: [total_net_cost]
        width: 12
    height: 520px

time_ranges: [rill-PM, rill-MTD, P3M, P6M, P12M]
filters:
  enable: true

theme: theme
